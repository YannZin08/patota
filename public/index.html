<!doctype html>
<html lang="pt-BR">
<head>

  <title>Patota</title>
  <meta name="description" content="Presença, placar ao vivo e artilharia da patota.">
  <meta name="theme-color" content="#16784a">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
